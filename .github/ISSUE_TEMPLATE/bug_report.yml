name: 🐛 Bug report
description: Report a bug to help improve Bali Project
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can so maintainers can reproduce the issue quickly.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP version, web server (Apache/Laragon/XAMPP/`php -S`), OS
      placeholder: "PHP 8.2, Laragon, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How did you trigger the issue?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include sanitized error messages — no credentials.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran `php -l` on the relevant files
        - label: I have not included any real credentials or SQL dumps
