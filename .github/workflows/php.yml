name: PHP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Lint all PHP files
        run: |
          set -e
          STATUS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /tmp/php-lint.log 2>&1; then
              echo "::error file=$file::PHP syntax error"
              cat /tmp/php-lint.log
              STATUS=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './storage/*' -print0)
          exit $STATUS
